[project]
name = "letta-memory"
version = "0.1.0"
description = "A Raven memory backend plugin: session learnings in a Letta server's archival memory."
requires-python = ">=3.12"
dependencies = [
    "raven",
    # The wire to the Letta REST API: same client the host uses for its own HTTP.
    "httpx>=0.27",
]

[project.entry-points."raven.plugins"]
letta-memory = "raven_letta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_letta"]

# The manifest is package data, not a stray file: discovery resolves it
# through importlib.resources inside the installed package, so a tree that
# ships the modules without it installs a plugin nothing can find (exact
# failure seen on 2026-11-05 with a root-level manifest: "no
# raven-plugin.toml found; skipping").
[tool.hatch.build]
include = [
    "raven_letta/**/*.py",
    "raven_letta/raven-plugin.toml",
]

[tool.hatch.build.targets.sdist]
include = ["raven_letta/", "pyproject.toml", "README.md", "tests/"]

[tool.uv.sources]
raven = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
